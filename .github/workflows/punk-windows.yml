name: punk windows build

# Fork-only release line. Every push to the punk branches builds a Windows
# *preview* binary (HERDR_BUILD_CHANNEL=preview, build_id = <date>-<sha>),
# publishes it as a GitHub prerelease, and refreshes the update manifests on the
# `builds` branch. The fork's updater reads those manifests, so an installed
# build sees "update available" and `herdr update` installs the next one.

on:
  workflow_dispatch:
  push:
    branches: [feat/accounts-sidebar-section, punk]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
  LIBGHOSTTY_VT_SIMD: "false"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Plan build identity
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          day="$(git show -s --format=%cs HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build_id="$day-$short_sha"
          base_version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          protocol="$(grep -m1 'pub const PROTOCOL_VERSION: u32' src/protocol/wire.rs | sed 's/.*= *\([0-9]*\);.*/\1/')"
          {
            echo "build_id=$build_id"
            echo "tag=punk-$build_id"
            echo "built_at=$built_at"
            echo "base_version=$base_version"
            echo "protocol=$protocol"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Build
        env:
          HERDR_BUILD_CHANNEL: preview
          HERDR_BUILD_ID: ${{ steps.plan.outputs.build_id }}
          HERDR_BUILD_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --locked --target x86_64-pc-windows-msvc 2>&1 | tee build.log

      - name: Unit tests for fork-only API behavior
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --target x86_64-pc-windows-msvc --lib -- \
            app::output_events \
            config::keybinds::tests::parse_navigation_keys \
            api::schema 2>&1 | tee -a build.log

      - name: Surface compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          # Raw job logs are not reachable from every network; annotations are.
          python3 - <<'PY'
          import re
          log = open("build.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n(?=(?:error|warning)(?:\[E\d+\])?: )", log)
          for block in blocks:
              if not block.startswith("error"):
                  continue
              head = block.splitlines()[0]
              loc = re.search(r"--> ([^:\n]+):(\d+):(\d+)", block)
              body = "%0A".join(block.splitlines()[:14])
              if loc:
                  print(f"::error file={loc.group(1)},line={loc.group(2)},col={loc.group(3)},title={head[:120]}::{body}")
              else:
                  print(f"::error title={head[:120]}::{body}")
          PY

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath herdr-windows-x86_64.zip
          $hash = (Get-FileHash -Algorithm SHA256 herdr-windows-x86_64.zip).Hash.ToLowerInvariant()
          "sha256=$hash" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT
          "commit=$env:GITHUB_SHA`nbuild_id=${{ steps.plan.outputs.build_id }}`nsha256=$hash  herdr-windows-x86_64.zip" | Out-File -Encoding utf8 BUILD_INFO.txt
          Get-Content BUILD_INFO.txt

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.plan.outputs.tag }}"
          subject="$(git log -1 --format=%s)"
          gh release create "$tag" herdr-windows-x86_64.zip BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "herdr-punk ${{ steps.plan.outputs.base_version }}-preview.${{ steps.plan.outputs.build_id }}" \
            --notes "$subject"$'\n\n'"Fork build from $GITHUB_SHA."

      - name: Write update manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manifests
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "${{ steps.plan.outputs.tag }}"
          build_id = "${{ steps.plan.outputs.build_id }}"
          url = f"https://github.com/{repo}/releases/download/{tag}/herdr-windows-x86_64.zip"
          notes = subprocess.check_output(["git", "log", "-15", "--format=- %s"], text=True).strip()
          asset = {"url": url, "sha256": "${{ steps.package.outputs.sha256 }}", "format": "zip"}
          meta = {
              "base_version": "${{ steps.plan.outputs.base_version }}",
              "commit": os.environ["GITHUB_SHA"],
              "built_at": "${{ steps.plan.outputs.built_at }}",
              "protocol": int("${{ steps.plan.outputs.protocol }}"),
              "endpoint_generation": 1,
          }
          preview = {"schema_version": 1, "channel": "preview", "build_id": build_id, **meta,
                     "notes": "## herdr-punk preview " + build_id + "\n\n" + notes,
                     "assets": {"windows-x86_64": asset},
                     "builds": {build_id: {**meta, "tag": tag, "assets": {"windows-x86_64": asset}}}}
          json.dump(preview, open("manifests/preview.json", "w"), indent=2)
          # Stable manifest: upstream's current release metadata, so the stable
          # channel never offers to replace the fork with an upstream binary.
          stable = json.load(open("distribution/latest.json"))
          json.dump(stable, open("manifests/latest.json", "w"), indent=2)
          PY
          cat manifests/preview.json | head -40

      - name: Publish manifests to builds branch
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/builds"
          git worktree add --detach "$out"
          cp herdr-windows-x86_64.zip BUILD_INFO.txt manifests/preview.json manifests/latest.json "$out/"
          cd "$out"
          git checkout --orphan builds
          git rm -rfq --cached . 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add herdr-windows-x86_64.zip BUILD_INFO.txt preview.json latest.json
          git commit -q -m "build: herdr-punk preview ${{ steps.plan.outputs.build_id }}"
          git push --force origin builds

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-windows-x86_64
          path: |
            herdr-windows-x86_64.zip
            BUILD_INFO.txt
          retention-days: 7
